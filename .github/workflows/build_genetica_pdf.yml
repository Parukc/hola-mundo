name: Build genetics PDF

on:
  pull_request:
    branches: [main]
    paths:
      - 'generate_genetica_pdf.py'
      - '.github/workflows/build_genetica_pdf.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install reportlab pypdf
      - run: python generate_genetica_pdf.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Guia_sindromes_hereditarios_cancer.pdf
          git commit -m "Generate genetics cancer guide PDF" || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: guia-sindromes-hereditarios-cancer
          path: Guia_sindromes_hereditarios_cancer.pdf
